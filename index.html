<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>D&D Toolkit</title>
        <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="shortcut icon" href="favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="D&amp;D Toolkit" />
        <link rel="manifest" href="site.webmanifest" />
        <!-- fanta.css first so styles.css can override it -->
        <link rel="stylesheet" href="fanta.css" />
        <link rel="stylesheet" href="styles.css" />
        <script src="main.js"></script>
    </head>
    <body>

        <header>
            <h1>Carter's D&D Toolkit</h1>
            <div id="header-buttons">
                <button id="header-button-condition" data-section="condition" onclick="switchSection('condition')">Character Condition</button>
                <button id="header-button-stat" data-section="stat" onclick="switchSection('stat')">Stat Roller</button>
                <button id="header-button-counter" data-section="counters" onclick="switchSection('counters')">Synced Counters</button>
            </div>
        </header>

        <main>
            <!-- Character Condition Section -->
            <section id="condition-section" class="tab-content" style="display:none;">
                <button id="add-character" onclick="addCharacter()">Add Character</button>
                <table style="width: 100%;" class="condition-table">
                    <colgroup>
                        <col style="width: 5%;">
                        <col style="width: 25%;">
                        <col style="width: 15%;">
                        <col style="width: 10%;">
                        <col style="width: 40%;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th></th>
                            <th>Character</th>
                            <th>Current HP</th>
                            <th>Max HP</th>
                            <th>Condition</th>
                        </tr>
                    </thead>
                    <tbody id="character-rows">
                    </tbody>
                    <tbody>
                    </tbody>
                </table>

                <!-- Blank row cloned by addCharacter() -->
                <template id="character-row-template">
                    <tr>
                        <td class="cell-remove"><button type="button" class="row-button remove-character" title="Remove character" aria-label="Remove character">✕</button></td>
                        <td class="cell-name"><input class="character-name" type="text" placeholder="Name" aria-label="Character name"></td>
                        <!-- data-label is shown as a heading on mobile, where the table header is hidden -->
                        <td class="cell-current-hp" data-label="Current HP">
                            <div class="hp-cell">
                                <input class="current-hp" type="number" aria-label="Current HP">
                                <button type="button" class="row-button reset-hp" title="Reset to max HP" aria-label="Reset to max HP">↺</button>
                            </div>
                        </td>
                        <td class="cell-max-hp" data-label="Max HP"><input class="max-hp" type="number" min="0" aria-label="Max HP"></td>
                        <td class="cell-condition">
                            <span class="condition-label"></span>
                            <meter class="condition-meter" value="0" min="0" max="100" style="width: 100%;"></meter>
                        </td>
                    </tr>
                </template>
            </section>

            <!-- Stat Roller Section -->
            <section id="stat-section" class="tab-content" style="display:none">
                <div id="stat-roller">
                    <!-- Stat boxes are built from #stat-template by renderStats() in main.js -->
                    <div class="stats" id="stats"></div>

                    <template id="stat-template">
                        <div class="stat">
                            <p class="modifier"></p>
                            <h1 class="stat-value"></h1>
                            <p class="rolls"></p>
                            <select class="stat-select" aria-label="Assign ability">
                                <option value="">--</option>
                                <option value="str">STR</option>
                                <option value="dex">DEX</option>
                                <option value="con">CON</option>
                                <option value="int">INT</option>
                                <option value="wis">WIS</option>
                                <option value="cha">CHA</option>
                            </select>
                        </div>
                    </template>

                    <button id="roll-button">Roll Stats</button>
                    <button id="remove-stat-allocations">Remove Stat Allocations</button>

                    <div class="card stat-panel">
                        <div class="stat-settings">
                            <h2>Settings</h2>
                            <div class="stat-setting">
                                <label for="number-of-stats">Number of stats</label>
                                <input type="number" id="number-of-stats" value="6" min="1" max="9">
                            </div>
                            <div class="stat-setting">
                                <label for="rolling-method">Rolling method</label>
                                <select id="rolling-method">
                                    <option value="standard" selected>Standard (4d6 drop lowest)</option>
                                    <option value="classic">Classic (3d6)</option>
                                </select>
                            </div>
                            <div class="stat-setting">
                                <label for="minimum-stat-threshold">Minimum stat total</label>
                                <input type="number" id="minimum-stat-threshold" value="75" min="0" max="90" title="Reroll until the stats add up to at least this (rescales when Number of stats changes)">
                            </div>
                            <div class="stat-setting">
                                <input type="checkbox" id="guarantee-16">
                                <label for="guarantee-16">Guarantee at least one 16 or higher</label>
                            </div>
                        </div>

                        <div class="stat-breakdown">
                        <table>
                            <thead>
                                <tr>
                                    <th colspan="2">Stats</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Total</td>
                                    <td id="stat-total">–</td>
                                </tr>
                                <tr>
                                    <td>Lowest</td>
                                    <td id="stat-lowest">–</td>
                                </tr>
                                <tr>
                                    <td>Highest</td>
                                    <td id="stat-highest">–</td>
                                </tr>
                                <tr>
                                    <td>Average</td>
                                    <td id="stat-average">–</td>
                                </tr>
                                <tr>
                                    <td>Luck Factor</td>
                                    <td id="stat-luck-factor">–</td>
                                </tr>
                            </tbody>
                        </table>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Synced Counters Section -->
            <section id="counters-section" class="tab-content" style="display:none">
                <h2>Synced Counters</h2>
                <div class="counter-toolbar">
                    <div class="button-group">
                        <button id="add-counter">Add Counter</button>
                        <button id="decrement-all-counters" title="Decrease every linked counter by 1">-1 Linked</button>
                        <button id="increment-all-counters" title="Increase every linked counter by 1">+1 Linked</button>
                    </div>
                    <div class="button-group">
                        <button id="reset-linked-counters" title="Reset every linked counter to its starting value">Reset Linked</button>
                        <button id="reset-all-counters" title="Reset every counter to its starting value">Reset All</button>
                        <button id="remove-all-counters" class="button-danger">Remove All</button>
                    </div>
                </div>
                <div class="counter-option">
                    <input type="checkbox" id="remove-counter-on-expire">
                    <label for="remove-counter-on-expire">Remove counter when effect expires</label>
                </div>
                <div id="counters-container" style="display:flex; flex-wrap:wrap;"></div>

                <!-- One counter card, cloned by renderCounters() in main.js -->
                <template id="counter-template">
                    <div class="counter">
                        <div class="counter-header">
                            <button type="button" class="row-button toggle-link" aria-pressed="true" aria-label="Linked to -1/+1 Linked buttons" title="Linked: affected by -1/+1 Linked (click to unlink)">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                                </svg>
                            </button>
                            <button type="button" class="row-button remove-counter" title="Remove counter" aria-label="Remove counter">✕</button>
                        </div>
                        <input type="text" class="counter-name" placeholder="Name" aria-label="Counter name">
                        <input type="number" class="counter-value" aria-label="Counter value">
                        <div class="counter-controls">
                            <button type="button" class="decrement-counter" aria-label="Decrease by 1">-1</button>
                            <button type="button" class="increment-counter" aria-label="Increase by 1">+1</button>
                        </div>
                    </div>
                </template>
            </section>

        </main>
    </body>
</html>
